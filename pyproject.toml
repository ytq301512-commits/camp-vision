[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camp-vision"
version = "0.1.0"
description = "OCR-based screen region watcher and faction overlay"
requires-python = ">=3.10,<3.14"
dependencies = [
  "PySide6>=6.7,<7",
  "numpy>=1.26,<3",
  "pyopencl>=2025.2; sys_platform == 'win32'",
  "rapidocr-onnxruntime>=1.4,<2",
  "onnxruntime-directml>=1.20,<2; sys_platform == 'win32'",
  "mss>=10,<11",
]

[project.scripts]
camp-vision = "camp_vision.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
